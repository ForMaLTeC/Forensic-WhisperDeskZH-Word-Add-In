name: Build and Publish VSTO Add-in

on:
  push:
    branches: [ main, develop]
    tags: [ 'v*' ]

env:
  SOLUTION_PATH: './ForensicWhisperDeskZH.sln'
  PROJECT_PATH: './ForensicWhisperDeskZH/ForensicWhisperDeskZH.csproj'
  MODEL_DOWNLOADER_PATH: './ModelDownloader/ModelDownloader.csproj'
  BUILD_CONFIGURATION: 'Release'
  BUILD_PLATFORM: 'Any CPU'
  PUBLISH_URL: 'https://your-domain.com/vsto/'
  APPLICATION_NAME: 'ForensicWhisperDeskZH'
  # Define which models to download for production
  WHISPER_MODELS: 'base, large'

jobs:
  build:
    runs-on: windows-latest
    
    outputs:
      version: ${{ steps.gitversion.outputs.semVer }}
      assembly-version: ${{ steps.gitversion.outputs.assemblySemVer }}
      artifact-name: ${{ steps.sanitize_name.outputs.FULL_ARTIFACT_NAME }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        lfs: true  # CRITICAL: Enable Git LFS checkout
        
    # Explicit Git LFS pull to ensure all LFS files are downloaded
    - name: Git LFS Pull
      run: |
        Write-Host "=== Git LFS Status Check ==="
        git lfs version
        
        Write-Host "=== Git LFS Files Tracking Status ==="
        git lfs ls-files
        
        Write-Host "=== Pulling Git LFS Files ==="
        git lfs pull
        
        Write-Host "=== Verifying LFS Files After Pull ==="
        
        # Check if any tracked files are still pointer files (should be actual content now)
        $lfsFiles = git lfs ls-files
        foreach ($line in $lfsFiles) {
          if ($line -match '(\S+)\s+\*\s+(.+)') {
            $hash = $matches[1]
            $filePath = $matches[2]
            
            if (Test-Path $filePath) {
              $fileSize = (Get-Item $filePath).Length
              $fileSizeMB = [math]::Round($fileSize / 1MB, 2)
              
              if ($fileSize -lt 200) {
                Write-Warning "⚠️  LFS file appears to still be a pointer: $filePath ($fileSize bytes)"
                
                # Show file content for debugging
                Write-Host "File content preview:"
                Get-Content $filePath -TotalCount 3
              } else {
                Write-Host "✅ LFS file properly downloaded: $filePath ($fileSizeMB MB)"
              }
            } else {
              Write-Warning "❌ LFS tracked file not found: $filePath"
            }
          }
        }

    - name: Setup GitVersion
      uses: gittools/actions/gitversion/setup@v0.9.15
      with:
        versionSpec: '5.x'
        
    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v0.9.15
      
    - name: Setup .NET Framework
      uses: microsoft/setup-msbuild@v2
      
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0'
        
    - name: Setup NuGet
      uses: nuget/setup-nuget@v2
      with:
        nuget-version: 'latest'
      
    - name: Restore packages for ModelDownloader
      run: dotnet restore ${{ env.MODEL_DOWNLOADER_PATH }}
      
    - name: Upload User Manual PDF
      uses: actions/upload-artifact@v4
      with: 
        name: User-Manual-PDF
        path: Documentation/User_Manual_ForensicWhisperDeskZH.pdf

    # Build and run ModelDownloader before main build
    - name: Build ModelDownloader (without signing)
      run: dotnet build ${{ env.MODEL_DOWNLOADER_PATH }} --configuration Release --no-restore /p:SignAssembly=false /p:SignManifests=false
      
    - name: Download Whisper Models using ModelDownloader
      run: |
        Write-Host "=== Starting Whisper Model Download Process ==="
        
        # Create Models directory in the main project
        $modelsDir = "ForensicWhisperDeskZH\Models"
        New-Item -ItemType Directory -Force -Path $modelsDir
        Write-Host "Created models directory: $modelsDir"
        
        # Check if we already have LFS models before downloading
        Write-Host "=== Checking for existing LFS model files ==="
        $existingModels = Get-ChildItem -Path $modelsDir -Filter "*.bin" -ErrorAction SilentlyContinue
        foreach ($model in $existingModels) {
          $sizeInMB = $model.Length / 1MB
          if ($model.Length -gt 1000000) {  # > 1MB means it's likely real content, not LFS pointer
            Write-Host "✅ Found existing valid model: $($model.Name) - $([math]::Round($sizeInMB, 1)) MB"
          } else {
            Write-Warning "⚠️  Found suspicious model file (might be LFS pointer): $($model.Name) - $($model.Length) bytes"
          }
        }
        
        # Parse the models from environment variable - keep as comma-separated
        $modelsString = "${{ env.WHISPER_MODELS }}"
        Write-Host "Models to download: $modelsString"
        
        try {
          # Run the ModelDownloader
          $downloaderPath = "ModelDownloader\bin\Release\net8.0\ModelDownloader.exe"
          
          if (Test-Path $downloaderPath) {
            Write-Host "Running ModelDownloader..."
            # Pass the comma-separated string directly to --models
            & $downloaderPath --models $modelsString --target $modelsDir
            
            if ($LASTEXITCODE -eq 0) {
              Write-Host "ModelDownloader completed successfully"
            } else {
              throw "ModelDownloader failed with exit code $LASTEXITCODE"
            }
          } else {
            throw "ModelDownloader executable not found at $downloaderPath"
          }
        } catch {
          Write-Host "ModelDownloader failed: $($_.Exception.Message)"
          Write-Host "Falling back to direct download method..."
          
          # Fallback to direct download
          $models = "${{ env.WHISPER_MODELS }}" -split ","
          $baseUrl = "https://huggingface.co/sandrohanea/whisper.net/resolve/v3/classic"
          
          foreach ($model in $models) {
            $model = $model.Trim()
            $fileName = "ggml-$model.bin"
            $filePath = "$modelsDir\$fileName"
            $downloadUrl = "$baseUrl/$fileName"
            
            if (Test-Path $filePath) {
              $fileSize = (Get-Item $filePath).Length / 1MB
              if ($fileSize -gt 1) {  # Only skip if it's a real file, not LFS pointer
                Write-Host "Model $model already exists ($([math]::Round($fileSize, 1)) MB) - skipping"
                continue
              } else {
                Write-Warning "Model $model file exists but is suspiciously small ($([math]::Round($fileSize, 3)) MB) - re-downloading"
              }
            }
            
            Write-Host "⬇️  Downloading $model model from $downloadUrl..."
            try {
              Invoke-WebRequest -Uri $downloadUrl -OutFile $filePath -UseBasicParsing
              $fileSize = (Get-Item $filePath).Length / 1MB
              Write-Host "Successfully downloaded $model model ($([math]::Round($fileSize, 1)) MB)"
            } catch {
              Write-Host "Failed to download $model model: $($_.Exception.Message)"
              exit 1
            }
          }
        }
        
        # Verify downloaded models with size validation
        Write-Host "=== Final Model Verification ==="
        if (Test-Path $modelsDir) {
          Get-ChildItem -Path $modelsDir -Filter "*.bin" | ForEach-Object {
            $sizeInMB = $_.Length / 1MB
            $status = if ($_.Length -lt 1000000) { " ⚠️  SUSPICIOUS SIZE" } else { " ✅" }
            Write-Host "    $($_.Name) - $([math]::Round($sizeInMB, 1)) MB$status"
          }
        }
        
        Write-Host "Whisper model download process completed successfully!"

    # Install Code Signing Certificate
    - name: Install Code Signing Certificate
      run: |
        # Decode certificate from base64
        $certBytes = [System.Convert]::FromBase64String("${{ secrets.SIGNING_CERTIFICATE }}")
        $certPath = "$env:TEMP\ForensicWhisperDeskZH.pfx"
        [System.IO.File]::WriteAllBytes($certPath, $certBytes)
        
        # Import certificate to Personal store
        $securePassword = ConvertTo-SecureString "${{ secrets.CERTIFICATE_PASSWORD }}" -AsPlainText -Force
        Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
        
        # Clean up certificate file
        Remove-Item $certPath -Force
        
        Write-Host "Certificate installed successfully"

    - name: Restore NuGet packages for solution
      run: nuget restore ${{ env.SOLUTION_PATH }}

    # ENHANCED: Verify LFS files in packages before build
    - name: Verify Package Dependencies and LFS Files
      run: |
        Write-Host "=== Verifying Package Dependencies and LFS Files ==="
        $packagesDir = "packages"
        
        if (Test-Path $packagesDir) {
          Write-Host "📦 Packages directory contents:"
          Get-ChildItem -Path $packagesDir | ForEach-Object {
            Write-Host "  $($_.Name)"
          }
          
          # Check for Whisper.net runtime files
          $whisperRuntimePaths = @(
            "$packagesDir\Whisper.net.Runtime.*\runtimes\win-x64\native\*",
            "$packagesDir\Whisper.net.AllRuntimes.*\runtimes\win-x64\native\*"
          )
          
          Write-Host "🔍 Checking Whisper.net native libraries:"
          foreach ($pattern in $whisperRuntimePaths) {
            $files = Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue
            foreach ($file in $files) {
              $sizeKB = [math]::Round($file.Length / 1KB, 1)
              $status = if ($file.Length -lt 1000) { " ⚠️  SUSPICIOUS" } else { " ✅" }
              Write-Host "    $($file.Name) - $sizeKB KB$status"
            }
          }
          
          # Check WebRtcVad files
          Write-Host "🔍 Checking WebRtcVad native libraries:"
          $vadPaths = @(
            "$packagesDir\WebRtcVadSharp.*\runtimes\win-x64\native\*"
          )
          
          foreach ($pattern in $vadPaths) {
            $files = Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue
            foreach ($file in $files) {
              $sizeKB = [math]::Round($file.Length / 1KB, 1)
              $status = if ($file.Length -lt 1000) { " ⚠️  SUSPICIOUS" } else { " ✅" }
              Write-Host "    $($file.Name) - $sizeKB KB$status"
            }
          }
        } else {
          Write-Warning "❌ Packages directory not found"
        }

    # FIXED: Single integrated build and publish step to prevent file corruption
    - name: Build and Publish VSTO Add-In (Integrated)
      run: |
        Write-Host "=== Integrated Build and Publish for VSTO Project ==="
        
        # Clean any previous builds to ensure fresh state
        msbuild ${{ env.PROJECT_PATH }} /t:Clean /p:Configuration=Release /p:Platform="x64"
        

        
        # Now perform the integrated build and publish in one step
        Write-Host "=== Performing Integrated Build and Publish ==="
        
        msbuild ${{ env.PROJECT_PATH }} `
          /t:Restore`;Build`;Publish `
          /p:Configuration=Release `
          /p:Platform="x64" `
          /p:PublishDir=publish\ `
          /p:PublishUrl="${{ env.PUBLISH_URL }}" `
          /p:InstallUrl="${{ env.PUBLISH_URL }}" `
          /p:ApplicationName="${{ env.APPLICATION_NAME }}" `
          /p:ProductName="${{ env.APPLICATION_NAME }}" `
          /p:BootstrapperEnabled=true `
          /p:CreateWebPageOnPublish=false `
          /p:AutorunEnabled=true `
          /p:ApplicationRevision=1 `
          /p:ApplicationVersion="${{ steps.gitversion.outputs.assemblySemVer }}" `
          /p:UseApplicationTrust=false `
          /p:PublishWizardShown=false `
          /p:IncludeNativeFilesInPublish=true `
          /maxcpucount:1
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Build and Publish failed with exit code $LASTEXITCODE"
          exit 1
        }

    # ENHANCED: Better verification with file integrity checks
    - name: Verify VSTO Publish Output with Integrity Checks
      run: |
        Write-Host "=== Enhanced VSTO Publish Verification ==="
        
        $publishDir = "ForensicWhisperDeskZH\publish"
        if (-not (Test-Path $publishDir)) {
          Write-Error "❌ Publish directory not found: $publishDir"
          exit 1
        }
        
        Write-Host "📁 Publish directory contents with integrity checks:"
        $suspiciousCount = 0
        Get-ChildItem -Path $publishDir -Recurse | ForEach-Object {
          $size = if ($_.PSIsContainer) { "DIR" } else { "$([math]::Round($_.Length / 1KB, 1)) KB" }
          $status = ""
          
          # Flag suspicious small files that should be larger
          if (-not $_.PSIsContainer) {
            if ($_.Name -like "*.dll.deploy" -and $_.Length -lt 1000) {
              $status = " ⚠️  SUSPICIOUS SIZE (LFS pointer?)"
              $suspiciousCount++
            } elseif ($_.Name -like "ggml-*.bin.deploy" -and $_.Length -lt 1000000) {  # Model files should be > 1MB
              $status = " ⚠️  SUSPICIOUS SIZE (LFS pointer?)"
              $suspiciousCount++
            } elseif ($_.Name -like "whisper*.dll.deploy" -and $_.Length -lt 1000) {
              $status = " ⚠️  SUSPICIOUS SIZE (LFS pointer?)"
              $suspiciousCount++
            }
          }
          
          Write-Host "  $($_.Name) - $size$status"
        }
        
        # Verify key VSTO files are present
        $requiredFiles = @("setup.exe", "*.vsto", "*.dll.manifest", "*.application")
        foreach ($pattern in $requiredFiles) {
          $found = Get-ChildItem -Path $publishDir -Filter $pattern -Recurse
          if ($found) {
            Write-Host "✅ Found required file(s): $($found.Name -join ', ')"
          } else {
            Write-Warning "❌ Missing required VSTO file pattern: $pattern"
          }
        }
        
        # Verify main DLL size and flag if suspicious
        $publishedDll = Get-ChildItem -Path $publishDir -Filter "ForensicWhisperDeskZH.dll.deploy" -Recurse
        if ($publishedDll) {
          $dllSize = [math]::Round($publishedDll.Length / 1KB, 1)
          Write-Host "=== Published Main DLL Size: $dllSize KB ==="
          
          if ($dllSize -lt 500) {
            Write-Error "❌ Main DLL size ($dllSize KB) is suspiciously small - likely missing dependencies or corrupted"
            exit 1
          } else {
            Write-Host "✅ Main DLL size looks reasonable"
          }
        }
        
        # Check for corrupted native libraries
        $suspiciousFiles = Get-ChildItem -Path $publishDir -Recurse -Filter "*.dll.deploy" | Where-Object { $_.Length -lt 1000 -and $_.Name -notlike "*ggml-whisper.dll*" }
        if ($suspiciousFiles) {
          Write-Warning "❌ Found potentially corrupted DLL files:"
          $suspiciousFiles | ForEach-Object {
            Write-Warning "  $($_.Name) - $([math]::Round($_.Length / 1KB, 1)) KB"
          }
          Write-Error "Build contains corrupted files (likely LFS pointers) - failing build"
          exit 1
        }
        
        if ($suspiciousCount -gt 0) {
          Write-Error "❌ Found $suspiciousCount suspicious files that appear to be LFS pointers instead of actual content"
          exit 1
        }
        
        Write-Host "✅ VSTO publish verification completed successfully"

    - name: Debug build output directories
      run: |
        Write-Host "=== Build Output Investigation ==="
        
        # List all directories that might contain build outputs
        $searchPaths = @(
          "ForensicWhisperDeskZH\bin\Release",
          "ForensicWhisperDeskZH\bin",
          "bin\Release",
          "ForensicWhisperDeskZH\bin\x64\Release",
          "ForensicWhisperDeskZH\publish"
        )
        
        foreach ($path in $searchPaths) {
          if (Test-Path $path) {
            Write-Host "📁 Found directory: $path"
            Get-ChildItem -Path $path -Recurse | ForEach-Object {
              $relativePath = $_.FullName.Substring((Get-Location).Path.Length + 1)
              $size = if ($_.PSIsContainer) { "DIR" } else { "$([math]::Round($_.Length / 1KB, 1)) KB" }
              Write-Host "    $relativePath - $size"
            }
            Write-Host ""
          } else {
            Write-Host "❌ Directory not found: $path"
          }
        }

    - name: Sanitize Artifact Name
      id: sanitize_name
      run: |
        # Get the ref name and sanitize it for artifact naming
        $refName = "${{ github.ref_name || github.sha }}"
        Write-Host "Original ref name: $refName"
        
        # Remove invalid characters: " : < > | * ? \r \n \ /
        $sanitizedName = $refName -replace '[":/<>|*?\r\n\\]', '-'
        
        # Remove multiple consecutive dashes and trim
        $sanitizedName = $sanitizedName -replace '-+', '-'
        $sanitizedName = $sanitizedName.Trim('-')
        
        # Ensure it's not empty
        if ([string]::IsNullOrWhiteSpace($sanitizedName)) {
          $sanitizedName = "unknown"
        }
        
        $fullArtifactName = "VSTO-Addin-Package-$sanitizedName"
        
        Write-Host "Sanitized artifact name: $fullArtifactName"
        
        # Set output for use in subsequent steps
        echo "SANITIZED_NAME=$sanitizedName" >> $env:GITHUB_OUTPUT
        echo "FULL_ARTIFACT_NAME=$fullArtifactName" >> $env:GITHUB_OUTPUT

    - name: Upload published artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.sanitize_name.outputs.FULL_ARTIFACT_NAME }}
        path: ForensicWhisperDeskZH\publish
        retention-days: 1  # Only keep for release job
      id: upload_artifact

    # Upload PDF documentation as separate artifact
    - name: Upload PDF Documentation
      uses: actions/upload-artifact@v4
      with:
        name: User-Manual-PDF-${{ steps.sanitize_name.outputs.SANITIZED_NAME }}
        path: Documentation\User_Manual_ForensicWhisperDeskZH.pdf
        retention-days: 1
      id: upload_pdf

  release:
    runs-on: windows-latest
    needs: build
    # Only run release job for main branch pushes (not PRs)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) || github.ref == 'refs/heads/develop'
    
    permissions:
      contents: write
      packages: write

    steps:
    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.build.outputs.artifact-name }}
        path: ./release-artifacts

    # Download PDF documentation
    - name: Download PDF Documentation
      uses: actions/download-artifact@v4
      with:
        name: User-Manual-PDF-${{ needs.build.outputs.sanitized-name }}
        path: ./pdf-documentation

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ needs.build.outputs.version }}
        release_name: Release v${{ needs.build.outputs.version }}
        body: |
          ## ForensicWhisperDeskZH Release v${{ needs.build.outputs.version }}
          
          **Important**: This package is split into multiple parts due to size limitations.

          ### Features
          - VSTO Add-in for Microsoft Word
          - Whisper-based transcription capabilities
          - Version: ${{ needs.build.outputs.version }}
          - Assembly Version: ${{ needs.build.outputs.assembly-version }}
          
          ### Installation Options
          
          **Quick Install (Recommended):**
          1. **Download ALL parts** (VSTO-Addin-Package-v${{ needs.build.outputs.version }}.zip.001, .002, etc.)
          2. **Extract using 7-Zip** - right-click the .001 file and extract
          3. **Run `setup.exe`** from the extracted files **as Administrator**

          ### Documentation
          📖 **User Manual** - Download the complete user manual in PDF format for detailed installation and usage instructions.

          ### Key Points for Users:
          1. **Download ALL parts** - The split archive won't work unless all parts are present
          2. **Extract from the first part** - Always right-click on `.001` file to extract
          3. **Use proper extraction tools** - 7-Zip, WinRAR, or similar tools that support split archives
          4. **Windows built-in extractor won't work** with split archives
          
          ### System Requirements
          - Microsoft Word 2016 or later
          - .NET Framework 4.8
          - Windows 10 or later
        draft: false
        prerelease: false
      id: create_release

    - name: Create ZIP from Artifact Contents (Split)
      run: |
        Write-Host "Creating split ZIP from artifact contents..."
        $version = "${{ needs.build.outputs.version }}"
        $zipBaseName = "VSTO-Addin-Package-v$version"
        
        Write-Host "Using version: $version"
        Write-Host "ZIP base name: $zipBaseName"
        
        # Use 7-Zip to create split archives (500MB parts)
        if (Get-Command "7z" -ErrorAction SilentlyContinue) {
          Write-Host "Using 7-Zip for split compression..."
          & 7z a -tzip "$zipBaseName.zip" ".\release-artifacts\*" -r -v1800m
        } else {
          # Install 7-Zip via chocolatey for splitting capability
          Write-Host "Installing 7-Zip..."
          choco install 7zip -y
          & "C:\Program Files\7-Zip\7z.exe" a -tzip "$zipBaseName.zip" ".\release-artifacts\*" -r -v1800m
        }
        
        # List created files for debugging
        Write-Host "=== Created Files ==="
        Get-ChildItem -Filter "$zipBaseName.zip*" | ForEach-Object {
          $size = [math]::Round($_.Length / 1MB, 2)
          Write-Host "✅ Created $($_.Name) ($size MB)"
        }
        
        # Set output for next step
        echo "ZIP_BASE_NAME=$zipBaseName" >> $env:GITHUB_OUTPUT
      id: create_zip

    - name: Upload Split Package Parts
      run: |
        $zipBaseName = "${{ steps.create_zip.outputs.ZIP_BASE_NAME }}"
        Write-Host "Looking for files with pattern: $zipBaseName.zip*"
        
        # List all files for debugging
        Write-Host "=== All ZIP files in directory ==="
        Get-ChildItem -Filter "*.zip*" | ForEach-Object {
          Write-Host "Found: $($_.Name)"
        }
        
        $parts = Get-ChildItem -Filter "$zipBaseName.zip*"
        
        if ($parts.Count -eq 0) {
          Write-Error "No ZIP parts found with pattern: $zipBaseName.zip*"
          exit 1
        }
        
        Write-Host "Found $($parts.Count) ZIP parts to upload"
        
        foreach ($part in $parts) {
          Write-Host "Uploading $($part.Name)..."
          
          $headers = @{
            'Authorization' = 'token ${{ secrets.GITHUB_TOKEN }}'
            'Content-Type' = 'application/zip'
          }
          
          $uploadUrl = "${{ steps.create_release.outputs.upload_url }}".Replace('{?name,label}', "?name=$($part.Name)")
          Write-Host "Upload URL: $uploadUrl"
          
          try {
            $response = Invoke-RestMethod -Uri $uploadUrl -Method Post -Headers $headers -InFile $part.FullName
            Write-Host "✅ Successfully uploaded $($part.Name)"
            Write-Host "Response: $($response.browser_download_url)"
          } catch {
            Write-Error "❌ Failed to upload $($part.Name): $($_.Exception.Message)"
            Write-Host "Exception details: $($_.Exception)"
            if ($_.Exception.Response) {
              $reader = New-Object System.IO.StreamReader($_.Exception.Response.GetResponseStream())
              $responseBody = $reader.ReadToEnd()
              Write-Host "Response body: $responseBody"
            }
          }
        }

    # Upload PDF documentation to release
    - name: Upload PDF Documentation to Release
      run: |
        Write-Host "=== Uploading PDF Documentation to Release ==="
        
        $pdfFile = Get-ChildItem -Path ".\pdf-documentation" -Filter "*.pdf" | Select-Object -First 1
        
        if (-not $pdfFile) {
          Write-Error "❌ PDF documentation file not found"
          exit 1
        }
        
        Write-Host "📄 Found PDF file: $($pdfFile.Name)"
        Write-Host "📄 File size: $([math]::Round($pdfFile.Length / 1KB, 1)) KB"
        
        $headers = @{
          'Authorization' = 'token ${{ secrets.GITHUB_TOKEN }}'
          'Content-Type' = 'application/pdf'
        }
        
        $uploadUrl = "${{ steps.create_release.outputs.upload_url }}".Replace('{?name,label}', "?name=$($pdfFile.Name)")
        Write-Host "Upload URL: $uploadUrl"
        
        try {
          $response = Invoke-RestMethod -Uri $uploadUrl -Method Post -Headers $headers -InFile $pdfFile.FullName
          Write-Host "✅ Successfully uploaded PDF documentation: $($pdfFile.Name)"
          Write-Host "📄 Download URL: $($response.browser_download_url)"
        } catch {
          Write-Error "❌ Failed to upload PDF documentation: $($_.Exception.Message)"
          Write-Host "Exception details: $($_.Exception)"
          if ($_.Exception.Response) {
            $reader = New-Object System.IO.StreamReader($_.Exception.Response.GetResponseStream())
            $responseBody = $reader.ReadToEnd()
            Write-Host "Response body: $responseBody"
          }
        }
